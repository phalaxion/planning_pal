<!doctype html>
<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Planning Poker — Admin</title>

	<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="/static/core/core.css?v=__ASSET_VERSION__">
	<script src="/static/core/core.js?v=__ASSET_VERSION__"></script>
	<script src="/static/core/Connection.js?v=__ASSET_VERSION__"></script>

	<link rel="stylesheet" href="/static/admin/admin.css?v=__ASSET_VERSION__">
	<script type="module" src="/static/admin/admin.js?v=__ASSET_VERSION__" defer></script>
</head>

<body>
	<pre id="status" class="debug-data"></pre>
	<pre id="debug" class="debug-data">debug</pre>

	<!-- Top bar -->
	<header class="topbar">
		<div class="topbar-left">
			<a href="/" class="room-brand">
				<div class="pip-icon">♠</div>
			</a>
			<span id="roomcode" class="uppercase">Room</span>
		</div>

		<!-- Story bar inline in header on wide screens -->
		<div class="story-bar" style="flex:1;margin-bottom:0">
			<span class="story-label">Story</span>
			<span id="story"></span>
		</div>
	</header>

	<a id="back-arrow" class="section-label" style="margin-bottom: 2rem;">&larr; Back to room</a>

	<!-- Participants -->
	<div class="section-label" style="position:relative;z-index:1;margin-bottom:10px">Participants</div>
	<section id="participants"></section>

	<!-- Actions -->
	<div class="action-bar" id="actions"></div>
</body>

</html>
